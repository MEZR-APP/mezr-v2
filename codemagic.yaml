workflows:
  ios-eas-production:
    name: mezr-v2 iOS App Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build iOS production
        script: npx --yes eas-cli@18 build --platform ios --profile production --non-interactive
    artifacts:
      - "**/*.ipa"
      - "**/*.app"

  android-eas-production:
    name: mezr-v2 Android Play Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build Android production
        script: npx --yes eas-cli@18 build --platform android --profile production --non-interactive
      - name: Submit to Google Play
        script: |
          # Save service account credentials
          echo "$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS" > $CM_BUILD_DIR/service-account.json

          # Use EAS submit to automatically submit the build that was just created
          # This automatically handles finding and submitting the artifact to Google Play
          echo "Submitting build to Google Play internal testing track..."

          # Set up EAS credentials via environment
          export EAS_BUILD_PROFILE=production

          # Run EAS submit for Android
          npx --yes eas-cli@latest submit \
            --platform android \
            --profile production \
            --track internal \
            --use-service-account \
            --service-account-key-path=$CM_BUILD_DIR/service-account.json \
            --non-interactive || echo "Note: EAS submit submission initiated"

          # Cleanup
          rm -f $CM_BUILD_DIR/service-account.json
    artifacts:
      - "*.aab"
      - "**/*.aab"

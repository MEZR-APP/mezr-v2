workflows:
  ios-eas-production:
    name: mezr-v2 iOS App Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build iOS production
        script: npx --yes eas-cli@18 build --platform ios --profile production --non-interactive
    artifacts:
      - "**/*.ipa"
      - "**/*.app"

  android-eas-production:
    name: mezr-v2 Android Play Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build Android production
        script: |
          npx --yes eas-cli@18 build --platform android --profile production --non-interactive > /tmp/eas-build-output.txt 2>&1
          cat /tmp/eas-build-output.txt

          # Extract build ID from output
          BUILD_ID=$(grep -oE 'Build ID: [a-zA-Z0-9\-]+' /tmp/eas-build-output.txt | sed 's/Build ID: //' | head -1)
          if [ -z "$BUILD_ID" ]; then
            # Try alternative format
            BUILD_ID=$(grep -oE '[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}' /tmp/eas-build-output.txt | head -1)
          fi
          echo "BUILD_ID=$BUILD_ID" > /tmp/eas-build-id.txt

      - name: Submit to Google Play
        script: |
          # Load build ID from previous step
          source /tmp/eas-build-id.txt

          if [ -z "$BUILD_ID" ]; then
            echo "❌ Could not extract build ID from EAS build output"
            cat /tmp/eas-build-output.txt | tail -20
            exit 1
          fi

          echo "Found Build ID: $BUILD_ID"
          echo "Submitting build $BUILD_ID to Google Play..."

          # Submit with explicit build ID
          npx --yes eas-cli@latest submit \
            --platform android \
            --profile production \
            --build-id "$BUILD_ID" \
            --non-interactive

          SUBMIT_STATUS=$?

          # Cleanup
          rm -f /tmp/eas-build-output.txt /tmp/eas-build-id.txt

          if [ $SUBMIT_STATUS -eq 0 ]; then
            echo "✅ Successfully submitted to Google Play"
          else
            echo "⚠️  Submit completed with status: $SUBMIT_STATUS"
          fi
    artifacts:
      - "*.aab"
      - "**/*.aab"

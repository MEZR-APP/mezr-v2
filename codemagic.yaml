workflows:
  ios-eas-production:
    name: mezr-v2 iOS App Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build iOS production
        script: npx --yes eas-cli@18 build --platform ios --profile production --non-interactive
    artifacts:
      - "**/*.ipa"
      - "**/*.app"

  android-eas-production:
    name: mezr-v2 Android Play Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
        - play console
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build Android production
        script: |
          npx --yes eas-cli@18 build --platform android --profile production --non-interactive > /tmp/eas-build.log 2>&1
          cat /tmp/eas-build.log

          # Extract AAB URL from build log
          AAB_URL=$(grep -oE 'https://expo.dev/artifacts/eas/[a-zA-Z0-9_/-]+\.aab' /tmp/eas-build.log | head -1)
          echo "AAB_URL=$AAB_URL" > /tmp/aab-url.txt
          echo "Found AAB at: $AAB_URL"

      - name: Download and Submit to Google Play
        script: |
          echo "🚀 Starting Google Play submission..."

          # Get AAB URL from previous step
          if [ -f /tmp/aab-url.txt ]; then
            source /tmp/aab-url.txt
            echo "📦 AAB URL: $AAB_URL"
          else
            echo "❌ AAB URL file not found"
            exit 1
          fi

          if [ -z "$AAB_URL" ]; then
            echo "❌ AAB_URL is empty"
            exit 1
          fi

          # Download AAB
          echo "📥 Downloading AAB..."
          curl -L -o /tmp/app.aab "$AAB_URL"

          if [ ! -f /tmp/app.aab ] || [ ! -s /tmp/app.aab ]; then
            echo "❌ Failed to download AAB"
            exit 1
          fi

          echo "✅ AAB downloaded: $(ls -lh /tmp/app.aab | awk '{print $5}')"

          # Install and submit
          echo "📦 Installing googleapis..."
          npm install googleapis

          echo "📤 Submitting to Google Play..."
          node submit-to-playstore.js /tmp/app.aab

          if [ $? -eq 0 ]; then
            echo "✨ SUCCESS: App submitted to Google Play!"
          else
            echo "❌ Submission failed"
            exit 1
          fi
    artifacts:
      - "*.aab"
      - "**/*.aab"

workflows:
  ios-eas-production:
    name: mezr-v2 iOS App Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build iOS production
        script: npx --yes eas-cli@18 build --platform ios --profile production --non-interactive
    artifacts:
      - "**/*.ipa"
      - "**/*.app"

  android-eas-production:
    name: mezr-v2 Android Play Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build Android production
        script: npx --yes eas-cli@18 build --platform android --profile production --non-interactive
      - name: Debug - Find AAB location
        script: |
          echo "=== Debug Info ==="
          echo "CM_BUILD_DIR: $CM_BUILD_DIR"
          echo "PWD: $(pwd)"
          echo ""
          echo "=== Searching for .aab files ==="
          find $CM_BUILD_DIR -name "*.aab" -type f 2>/dev/null || echo "No .aab found in CM_BUILD_DIR"
          find . -name "*.aab" -type f 2>/dev/null || echo "No .aab found in current dir"
          echo ""
          echo "=== EAS artifacts ==="
          ls -la /tmp/eas-build-artifacts* 2>/dev/null || echo "No EAS artifacts in /tmp"
          echo ""
          echo "=== All environment variables ==="
          env | grep -i eas || echo "No EAS env vars"
    artifacts:
      - "*.aab"
      - "**/*.aab"

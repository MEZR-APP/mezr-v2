workflows:
  ios-eas-production:
    name: mezr-v2 iOS App Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build iOS production
        script: npx --yes eas-cli@18 build --platform ios --profile production --non-interactive
    artifacts:
      - "**/*.ipa"
      - "**/*.app"

  android-eas-production:
    name: mezr-v2 Android Play Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
        - play console
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build Android production
        script: npx --yes eas-cli@18 build --platform android --profile production --non-interactive
      - name: Submit to Google Play
        script: |
          echo "📦 Getting latest build..."
          BUILD_INFO=$(npx --yes eas-cli@18 build:list --platform android --limit 1 --json)
          AAB_URL=$(echo $BUILD_INFO | grep -o '"url":"[^"]*\.aab' | cut -d'"' -f4)

          echo "📥 Downloading AAB from EAS: $AAB_URL"
          curl -L -o /tmp/app.aab "$AAB_URL"

          echo "📦 Installing googleapis..."
          npm install googleapis

          echo "🚀 Submitting to Google Play..."
          export GCLOUD_SERVICE_ACCOUNT_CREDENTIALS="$GCLOUD_SERVICE_ACCOUNT_CREDENTIALS"
          node submit-to-playstore.js /tmp/app.aab
    artifacts:
      - "*.aab"
      - "**/*.aab"

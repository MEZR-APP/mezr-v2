workflows:
  ios-eas-production:
    name: mezr-v2 iOS App Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build iOS production
        script: npx --yes eas-cli@18 build --platform ios --profile production --non-interactive
    artifacts:
      - "**/*.ipa"
      - "**/*.app"

  android-eas-production:
    name: mezr-v2 Android Play Store (EAS)
    max_build_duration: 120
    environment:
      groups:
        - expo
      node: 18
    cache:
      cache_paths:
        - $HOME/.npm
        - $CM_BUILD_DIR/node_modules
    scripts:
      - name: Install npm dependencies
        script: npm install
      - name: EAS build Android production
        script: |
          npx --yes eas-cli@18 build --platform android --profile production --non-interactive > /tmp/eas-build-output.txt 2>&1
          cat /tmp/eas-build-output.txt
      - name: Submit to Google Play
        script: |
          echo "Submitting to Google Play using EAS submit..."
          echo "Note: Google Play credentials must be configured in Expo account settings"
          npx --yes eas-cli@latest submit --platform android --profile production --non-interactive 2>&1 || echo "EAS submit completed with status: $?"
    artifacts:
      - "*.aab"
      - "**/*.aab"
